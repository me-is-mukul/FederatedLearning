services:
  mosquitto:
    image: eclipse-mosquitto:2.0
    ports:
      - "1883:1883"
    volumes:
      - ./node-red/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro

  nodered:
    build: ./node-red
    ports:
      - "1880:1880"
    environment:
      MQTT_HOST: mosquitto
      MONGO_URI: ${MONGO_URI_FOR_DOCKER:-mongodb://host.docker.internal:27017}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - mosquitto
